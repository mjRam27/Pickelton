spring:
  application:
    name: pickelton-backend

  profiles:
    active: ${SPRING_PROFILE:dev}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:${DB_URL}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        # Upstash needs TLS; set SPRING_DATA_REDIS_SSL_ENABLED=false for a local redis-server.
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

otp:
  default-country-code: ${OTP_DEFAULT_COUNTRY_CODE:+91}
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}

match:
  cache-ttl-minutes: ${MATCH_CACHE_TTL_MINUTES:120}

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:3000}

admin:
  api-key: ${ADMIN_API_KEY:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

# SMS verification codes via Twilio Verify. Leave empty locally: codes are then logged (dev profile only).
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

# Private directory for host identity documents. Never expose it as static content.
kyc:
  upload-dir: ${KYC_UPLOAD_DIR:uploads/kyc}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] [%thread] %logger{40} - %msg%n"
  level:
    root: INFO
    com.pickelton: INFO
