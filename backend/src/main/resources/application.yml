spring:
  application:
    name: pickelton-backend

  profiles:
    active: ${SPRING_PROFILE:dev}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:${DB_URL}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:3000}

admin:
  api-key: ${ADMIN_API_KEY:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] [%thread] %logger{40} - %msg%n"
  level:
    root: INFO
    com.pickelton: INFO
