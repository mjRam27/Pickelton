spring:
  application:
    name: pickelton-backend

  profiles:
    active: ${SPRING_PROFILE:dev}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:${DB_URL}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}

match:
  cache-ttl-minutes: ${MATCH_CACHE_TTL_MINUTES:120}

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:3000}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

storage:
  s3:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:eu-central-1}
    bucket-name: ${S3_BUCKET_NAME:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] [%thread] %logger{40} - %msg%n"
  level:
    root: INFO
    com.pickelton: INFO
