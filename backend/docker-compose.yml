services:
  postgres:
    image: postgres:16-alpine
    container_name: pickelton-postgres
    environment:
      POSTGRES_DB: pickelton
      POSTGRES_USER: pickelton
      POSTGRES_PASSWORD: pickelton
    ports:
      - "5432:5432"
    volumes:
      - pickelton_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickelton -d pickelton"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pickelton-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pickelton
      DB_USERNAME: pickelton
      DB_PASSWORD: pickelton
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-2592000000}
      REDIS_URL: ${REDIS_URL:-}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pickelton_postgres_data:
