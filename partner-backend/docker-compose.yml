services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pickelton_partner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - partner_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickelton_partner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 8090
      DATABASE_URL: postgresql://postgres:postgres@database:5432/pickelton_partner
      DATABASE_SSL: "false"
      JWT_SECRET: local-development-secret-change-before-production
      ALLOWED_ORIGINS: http://localhost:3001
    ports:
      - "8090:8090"
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/migrate.js && node src/server.js"]

volumes:
  partner_postgres:
